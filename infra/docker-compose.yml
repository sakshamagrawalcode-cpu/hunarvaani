name: hunarvaani

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hv
      POSTGRES_PASSWORD: hv
      POSTGRES_DB: hv
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hv -d hv"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    env_file: ../.env
    volumes:
      - ../audio:/app/audio
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    env_file: ../.env
    volumes:
      - hf_cache:/models
      - ../audio:/app/audio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://api:8000
    profiles: ["tunnel"]
    depends_on:
      - api

volumes:
  pgdata:
  hf_cache:
