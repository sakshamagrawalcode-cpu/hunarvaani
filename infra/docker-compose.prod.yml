# The server in India (step A13): the same services as on the laptop, restarted when they stop,
# plus Caddy for HTTPS on your own domain. No tunnel, so the Exotel URL never changes.
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
# Needs DOMAIN=api.example.in in .env and an A record for it pointing at this server.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
