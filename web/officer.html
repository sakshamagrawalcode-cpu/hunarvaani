<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HunarVaani Console</title>
<link rel="stylesheet" href="/web/console.css">
</head>
<body>
<!-- The page holds no personal data: everything comes from the API after the officer logs in. -->
<div id="login" class="login hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand big"><span class="logo">HV</span><span>HunarVaani<small>Officer console</small></span></div>
    <label>User<input class="in" id="loginUser" name="username" autocomplete="username" value="officer" required></label>
    <label>Password<input class="in" id="loginPw" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary wide" type="submit">Log in</button>
    <p class="error" id="loginErr" role="alert"></p>
    <p class="tiny">The password is <span class="mono">OFFICER_PASSWORD</span> in the <span class="mono">.env</span> file.
      Every view, change and erase is written to the audit log.</p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><span class="logo">HV</span><span>HunarVaani<small>Officer console</small></span></div>
    <nav class="tabs" id="tabs">
      <a href="#live" data-tab="live"><i data-icon="phone"></i>Live call</a>
      <a href="#people" data-tab="people"><i data-icon="users"></i>Profiles</a>
      <a href="#policy" data-tab="policy"><i data-icon="sliders"></i>Ranking policy</a>
    </nav>
    <div class="who"><span class="pill" id="modePill"></span><span id="whoName"></span>
      <button class="btn sm ghost" id="logout"><i data-icon="logout"></i>Log out</button></div>
  </header>
  <div class="warnbar hidden" id="pwWarn">The officer password is still <b>change-me</b>. Set <span class="mono">OFFICER_PASSWORD</span> in <span class="mono">.env</span> and restart.</div>
  <main id="view"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<script src="/web/console.js"></script>
</body>
</html>
